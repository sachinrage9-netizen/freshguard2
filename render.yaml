services:
  - type: web
    name: freshguard2
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r food_safety_poc/requirements.txt"
    startCommand: "gunicorn --chdir food_safety_poc --workers 1 --bind 0.0.0.0:$PORT render_app:app"
    envVars:
      - key: DEPLOYMENT_MODE
        value: render
